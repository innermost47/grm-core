<body>
  <canvas id="scene" aria-label="L'univers en 3D / the universe in 3D"></canvas>
  <noscript>
    <h1>L'Univers relationnel · The Relational Universe</h1>
    <p>Une simulation 3D de l'univers, du Big Bang à la fin des temps, où chaque nombre est tenu par un seul réseau de relations (GRM). Elle a besoin de JavaScript et de WebGL.</p>
    <p>A 3D simulation of the universe, from the Big Bang to the end of time, where every number is held by one network of relations (GRM). It needs JavaScript and WebGL.</p>
    <p><a href="https://github.com/innermost47/grm-core">github.com/innermost47/grm-core</a></p>
  </noscript>

  <section id="intro">
    <div class="card">
      <button id="lang" class="lang"></button>
      <h1 id="title"></h1>
      <p id="lead" class="lead"></p>
      <div id="intro-text"></div>
      <button id="launch" class="primary"></button>
      <button id="open-settings" class="secondary"></button>
      <p id="sound-hint" class="hint"></p>
      <footer>
        <p id="by"></p>
        <p><a id="source" href="https://github.com/innermost47/grm-core" target="_blank" rel="noopener"></a> · <span id="license"></span></p>
      </footer>
    </div>
  </section>

  <section id="hud" hidden>
    <div id="caption">
      <div id="epoch"></div>
      <div id="epoch-text"></div>
      <dl class="readout">
        <dt id="k-time"></dt><dd id="clock"></dd>
        <dt id="k-left" hidden></dt><dd id="left" hidden></dd>
        <dt id="k-temp"></dt><dd id="temp"></dd>
        <dt id="k-size"></dt><dd id="size"></dd>
      </dl>
      <div id="message" hidden><span id="message-text"></span><button id="message-settings" hidden></button></div>
    </div>
    <div id="controls">
      <div class="track"><input id="timeline" type="range" min="0" max="1000" value="0"><span id="today-mark"></span><div id="chapters-marks"></div></div>
      <div class="buttons">
        <button id="play"></button><button id="today"></button><button id="toend"></button><button id="newbang"></button>
        <button id="chapters"></button><button id="btn-settings"></button><button id="btn-elastics"></button><button id="mute"></button>
      </div>
    </div>
  </section>
  <div id="sun-label" hidden>☉</div>

  <!-- the pause at the start of each epoch, at the end, and today -->
  <div id="pause" hidden>
    <div class="pause-card" role="dialog" aria-live="polite" aria-labelledby="pause-title">
      <div id="pause-kicker" class="kicker"></div>
      <h2 id="pause-title"></h2>
      <p id="pause-text"></p>
      <p id="pause-extra" class="extra" hidden></p>
      <dl id="pause-values" class="readout"></dl>
      <button id="pause-main" class="primary"></button>
      <div class="pause-row"><button id="pause-second"></button><button id="pause-toggle"></button></div>
    </div>
  </div>

  <aside id="settings" class="panel" hidden>
    <header><h2 id="settings-title"></h2><button data-close></button></header>
    <div class="preset-row"><label id="presets-label" for="presets"></label><select id="presets"></select><button id="reset"></button></div>
    <button id="settings-launch" class="primary"></button>
    <div id="sliders"></div>
    <p id="reset-hint" class="hint"></p>
    <p id="invalid" class="invalid" hidden></p>
    <div class="save-row"><input id="save-name" maxlength="40"><button id="save"></button></div>
  </aside>

  <aside id="elastics" class="panel" hidden>
    <header><h2 id="elastics-title"></h2><button data-close></button></header>
    <div id="key-values"></div>
    <div id="relations"></div>
  </aside>

  <script type="module" src="app.js"></script>
</body>
</html>
